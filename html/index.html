<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetFlow — Portal Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F9F2FB;
    --surface: #FFFFFF;
    --primary: #2F76BE;
    --primary-hover: #1A4E87;
    --hr-accent: #122040;
    --hr-accent-hover: #1A2D5C;
    --ink: #1B1E2E;
    --muted: #6C7287;
    --border: #DBE4F5;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 16px;
    --shadow: 0 16px 40px rgba(26, 36, 56, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .split-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 900px;
    display: flex;
    overflow: hidden;
    box-shadow: var(--shadow);
    min-height: 550px;
  }
  .login-side {
    flex: 1;
    padding: 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* Left Side - Employee Styling */
  .employee-side {
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  /* Right Side - HR Styling */
  .hr-side {
    background: #F8FAFC;
  }
  .header-block {
    margin-bottom: 28px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .employee-side .badge { background: var(--primary); color: #fff; }
  .hr-side .badge { background: var(--hr-accent); color: #fff; }
  
  h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  input {
    width: 100%;
    padding: 12px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: #fff;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--primary); }
  
  .btn {
    width: 100%;
    padding: 13px;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-emp { background: var(--primary); }
  .btn-emp:hover { background: var(--primary-hover); }
  .btn-hr { background: var(--hr-accent); }
  .btn-hr:hover { background: var(--hr-accent-hover); }

  /* Responsive layout for smaller screens */
  @media (max-width: 768px) {
    .split-container { flex-direction: column; }
    .employee-side { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="split-container">
  
  <!-- LEFT SIDE: EMPLOYEE LOGIN -->
  <div class="login-side employee-side">
    <div class="header-block">
      <span class="badge">Workspace</span>
      <h2>Employee Portal</h2>
      <p>Request assets & check configuration tracks</p>
    </div>
    <form id="employeeForm">
      <div class="form-group">
        <label for="emp-user">Employee ID / Username</label>
        <input type="text" id="emp-user" placeholder="e.g., john_doe" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="emp-pass">Password</label>
        <input type="password" id="emp-pass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-emp">Access Workspace</button>
    </form>
  </div>

  <!-- RIGHT SIDE: HR LOGIN -->
  <div class="login-side hr-side">
    <div class="header-block">
      <span class="badge">Management</span>
      <h2>HR Command Center</h2>
      <p>Review active logs & handle inventory tickets</p>
    </div>
    <form id="hrForm">
      <div class="form-group">
        <label for="hr-user">Admin Username</label>
        <input type="text" id="hr-user" placeholder="e.g., admin_ops" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="hr-pass">Security Password</label>
        <input type="password" id="hr-pass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-hr">Launch Operations</button>
    </form>
  </div>

</div>

<script>
  // Handle Employee Form Routing
  document.getElementById('employeeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'employee.html';
  });

  // Handle HR Form Routing
  document.getElementById('hrForm').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'hr.html';
  });
</script>

</body>
</html>
