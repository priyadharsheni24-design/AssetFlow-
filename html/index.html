<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetFlow — Portal Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F9F2FB;
    --surface: #FFFFFF;
    --primary: #2F76BE;
    --primary-hover: #1A4E87;
    --ink: #1B1E2E;
    --muted: #6C7287;
    --border: #DBE4F5;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 12px;
    --shadow: 0 16px 40px rgba(26, 36, 56, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow);
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  input {
    width: 100%;
    padding: 12px 16px;
    font-family: var(--font-body);
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--primary);
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .btn:hover {
    background: var(--primary-hover);
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="header">
    <div class="logo">AF</div>
    <h1>Welcome to AssetFlow</h1>
    <p>Sign in to access your dashboard portal</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g., hr_admin or john_doe" required autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn">Sign In</button>
  </form>

  <div class="hint">
    <strong>Tip:</strong> Use <code>hr</code> or <code>admin</code> in the username to test the HR dashboard. Any other name routes to the Employee portal.
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim().toLowerCase();
    
    // Check username string to route the user correctly
    if (username.includes('hr') || username.includes('admin')) {
      window.location.href = 'hr.html';
    } else {
      window.location.href = 'employee.html';
    }
  });
</script>

</body>
</html>
